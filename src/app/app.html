<div class="container">
  <h1>My Record Collection</h1>

  <nav class="nav-bar">
    <a routerLink="/records" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      All Records
    </a>

    <a routerLink="/records/add" routerLinkActive="active">
      Add Record
    </a>

    <button type="button" (click)="toggleGuard()">
      {{ guardEnabled() ? 'Unlock Editing' : 'Lock Editing' }}
    </button>

    @if (loadingService.isLoading()) {
      <span class="loading-indicator">Loading...</span>
    }
  </nav>

  <router-outlet />
</div>
