@if (record(); as r) {
  <article class="detail">
    <h2>{{ r.collectionName }}</h2>
    <img [src]="r.artworkUrl100" [alt]="r.collectionName" width="250">
    <p><strong>Artist:</strong> {{ r.artistName }}</p>
    <p><strong>Genre:</strong> {{ r.primaryGenreName }}</p>
    @if (r.releaseDate) {
      <p><strong>Year Released:</strong> {{ r.releaseDate }}</p>
    } @else {
      <p>Release year unknown.</p>
    }
  </article>

  <a routerLink="/records">Back to all records</a>
} @else {
  <p>No record with id {{ id() }}.</p>
  <a routerLink="/records">Back to all records</a>
}
